apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abhaypratap57302-glitch/helm-test-config.git
    targetRevision: main
    path: helm-test
  destination:
    server: https://kubernetes.default.svc
    namespace: helm-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
